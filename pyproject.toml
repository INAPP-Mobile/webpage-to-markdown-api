[project]
name = "webpage-to-markdown-api"
version = "1.0.0"
description = "Convert any web page to clean Markdown — Mozilla Readability + markdownify + httpx"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require network access (slow, may fail offline)",
]
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
