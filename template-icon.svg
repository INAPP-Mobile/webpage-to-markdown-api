<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Document icon (left) -->
  <rect x="10" y="22" width="28" height="48" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <!-- Folded corner -->
  <path d="M34 22 L34 28 L28 28 Z" fill="white" opacity="0.3"/>
  <!-- Text lines in document -->
  <line x1="16" y1="34" x2="32" y2="34" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="16" y1="42" x2="30" y2="42" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="16" y1="50" x2="28" y2="50" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="16" y1="58" x2="24" y2="58" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Right arrow -->
  <line x1="42" y1="46" x2="54" y2="46" stroke="white" stroke-width="2.5"/>
  <polyline points="50,40 56,46 50,52" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Markdown block (right) -->
  <rect x="60" y="22" width="30" height="48" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <!-- Markdown heading - # mark -->
  <text x="66" y="38" fill="white" font-family="monospace" font-size="9" font-weight="bold" opacity="0.9">#</text>
  <line x1="72" y1="35" x2="84" y2="35" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Text lines -->
  <line x1="66" y1="46" x2="84" y2="46" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="66" y1="52" x2="78" y2="52" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Markdown bold/italic indicator -->
  <text x="66" y="63" fill="white" font-family="monospace" font-size="7" opacity="0.6">**text**</text>
</svg>
